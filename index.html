<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tung Tangle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <header>

        <div>
            <h1>🟫 TUNG TANGLE</h1>

            <p class="subtitle">
                Train. Battle. Evolve. Become the Alpha.
            </p>
        </div>

        <div class="header-buttons">

            <button onclick="saveGame()">💾 Save</button>
            <button onclick="loadGame()">📂 Load</button>
            <button onclick="openLeaderboard()">🏆 Leaderboard</button>

        </div>

    </header>


    <!-- TURN -->

    <section id="turn-panel" class="turn-panel turn-player">

        <div id="turn-icon">🟢</div>

        <div>
            <strong id="turn-title">YOUR TURN</strong>

            <p id="turn-description">
                Choose an action.
            </p>
        </div>

        <div class="turn-number">

            TURN

            <strong id="turn-number">1</strong>

        </div>

    </section>


    <!-- PLAYER -->

    <section class="card player-card">

        <div class="player-header">

            <div class="sprite-box">

                <canvas
                    id="player-sprite"
                    width="32"
                    height="32"
                ></canvas>

            </div>

            <div>

                <h2 id="tung-name">
                    Chomper
                </h2>

                <p id="species">
                    Tung
                </p>

            </div>

            <div class="level-box">

                LEVEL

                <strong id="level">
                    1
                </strong>

            </div>

        </div>


        <div class="bars">

            <div class="bar-container">

                <span>❤️ HP</span>

                <div class="bar">
                    <div id="hp-bar" class="bar-fill hp"></div>
                </div>

                <span id="hp-text">
                    100 / 100
                </span>

            </div>


            <div class="bar-container">

                <span>⚡ Energy</span>

                <div class="bar">
                    <div id="energy-bar" class="bar-fill energy"></div>
                </div>

                <span id="energy-text">
                    100 / 100
                </span>

            </div>


            <div class="bar-container">

                <span>⭐ XP</span>

                <div class="bar">
                    <div id="xp-bar" class="bar-fill xp"></div>
                </div>

                <span id="xp-text">
                    0 / 100
                </span>

            </div>

        </div>


        <div class="stats">

            <div>
                💪
                <strong id="power">10</strong>
                <small>Power</small>
            </div>

            <div>
                🛡️
                <strong id="defence">5</strong>
                <small>Defence</small>
            </div>

            <div>
                ⚡
                <strong id="speed">5</strong>
                <small>Speed</small>
            </div>

            <div>
                🏆
                <strong id="wins">0</strong>
                <small>Wins</small>
            </div>

        </div>


        <div class="location-info">

            📍 <span id="location">Tung Town</span>

            • ROUND

            <strong id="round">1</strong>

        </div>

    </section>


    <!-- AI -->

    <section class="card ai-card">

        <div class="section-heading">

            <h2>
                🤖 AI TUNGS
                <span id="ai-count"></span>
            </h2>

            <button onclick="openLeaderboard()">
                🏆 Rankings
            </button>

        </div>

        <div id="ai-list"></div>

    </section>


    <!-- ACTIONS -->

    <section class="actions">

        <button class="action-button"
                onclick="playerAction('explore')">

            🌲

            <strong>Explore</strong>

            <small>
                Find items & XP
            </small>

        </button>


        <button class="action-button"
                onclick="playerAction('power')">

            💪

            <strong>Train Power</strong>

            <small>
                Increase attack
            </small>

        </button>


        <button class="action-button"
                onclick="playerAction('defence')">

            🛡️

            <strong>Train Defence</strong>

            <small>
                Increase defence
            </small>

        </button>


        <button class="action-button"
                onclick="playerAction('speed')">

            ⚡

            <strong>Train Speed</strong>

            <small>
                Increase speed
            </small>

        </button>


        <button class="action-button"
                onclick="playerAction('rest')">

            💤

            <strong>Rest</strong>

            <small>
                Recover HP & energy
            </small>

        </button>


        <button class="action-button"
                onclick="playerAction('fight')">

            ⚔️

            <strong>Fight</strong>

            <small>
                Battle a rival
            </small>

        </button>


        <button class="action-button"
                onclick="openInventory()">

            🎒

            <strong>Inventory</strong>

            <small>
                Use an item
            </small>

        </button>


        <button class="action-button"
                onclick="openTravel()">

            🗺️

            <strong>Travel</strong>

            <small>
                Visit locations
            </small>

        </button>

    </section>


    <!-- LOG -->

    <section class="card log-card">

        <h2>📜 Adventure Log</h2>

        <div id="log"></div>

    </section>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button
            class="close"
            onclick="closeModal()"
        >
            ✕
        </button>

        <h2 id="modal-title"></h2>

        <div id="modal-body"></div>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
